name: test-entry-c

on:
  workflow_dispatch:
    inputs:
      send_telegram_test:
        description: "Send one Telegram connectivity test (not a trade alert)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        shell: bash
        run: |
          # Accept the repo's current `test/` folder or the usual `tests/` name.
          if [[ -d tests ]]; then
            test_dir=tests
          elif [[ -d test ]]; then
            test_dir=test
          else
            echo "::error::No test/ or tests/ directory found."
            exit 1
          fi
          python -m unittest discover -s "$test_dir" -v
      - name: Compile scanner
        run: python -m py_compile entry_c.py ob_precision.py indicators.py

      - name: Send optional Telegram connectivity test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_telegram_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "0"
        run: python entry_c.py --symbols RELIANCE --test-telegram
