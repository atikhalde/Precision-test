name: scan-entry-c

on:
  schedule:
    # UTC: 08:30–16:25 IST weekdays. Extra edge polls safely skip closed markets.
    # Actions schedules may be delayed; use a VPS for dependable late-session polling.
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print alerts only; do not send or update the live ledger'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Serialize live/manual scans so two runners cannot send from the same old ledger.
concurrency:
  group: entry-c-live-scanner
  cancel-in-progress: false

jobs:
  scan:
    # Only main may operate the live alert ledger. PRs are covered by tests.yml.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      C_SIGNAL_START: ${{ vars.C_SIGNAL_START || '15:15' }}
      # Settled-candle re-check after the 15:30 IST close. Set the repository
      # variable to '0'/'off' to disable it.
      C_POST_CLOSE_UNTIL: ${{ vars.C_POST_CLOSE_UNTIL || '17:00' }}
      # Yahoo's NSE intraday feed normally lags ~15 minutes. A 5-minute limit
      # rejected every quote inside the candidate window, so keep this above the
      # observed provider delay; stale-but-current-session bars are used and the
      # delay is stated in the alert.
      MAX_QUOTE_AGE_SECONDS: ${{ vars.MAX_QUOTE_AGE_SECONDS || '1200' }}
      ACCOUNT_CAPITAL_INR: ${{ vars.ACCOUNT_CAPITAL_INR }}
      RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '1.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Find latest persistent C ledger
        id: ledger
        uses: actions/github-script@v7
        with:
          script: |
            // Artifacts are newest-first. Pagination avoids unrelated test artifacts
            // hiding the ledger. Never silently start over if the latest has expired.
            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { ...context.repo, name: 'entry-c-live-state', per_page: 100 }
            )) {
              const artifact = response.data.find(a => a.name === 'entry-c-live-state');
              if (!artifact) continue;
              if (artifact.expired) throw new Error('C ledger expired. Restore the ledger before enabling live scans.');
              core.setOutput('artifact_id', String(artifact.id));
              core.setOutput('run_id', String(artifact.workflow_run.id));
              core.info(`Restoring C ledger from run ${artifact.workflow_run.id}`);
              return;
            }
            core.info('No previous C ledger: first-run initialization. Do not delete live-state artifacts.');

      - name: Restore persistent C ledger
        if: steps.ledger.outputs.artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.ledger.outputs.artifact_id }}
          merge-multiple: true
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ steps.ledger.outputs.run_id }}

      - name: Scan NSE symbols and send qualifying C alerts
        id: scan
        run: |
          # Keep the scanner's own diagnostics: the exit code still decides the
          # step result, and the log is summarised in the next step.
          python entry_c.py --symbols-file symbols.txt --state-file state_c.json --once 2>&1 | tee entry_c_scan.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"

      - name: Preserve live C ledger, including partial successful deliveries
        if: ${{ always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && env.DRY_RUN == '0' && hashFiles('state_c.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: entry-c-live-state
          path: state_c.json
          retention-days: 90
          if-no-files-found: error

      - name: Explain scan result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: |
          {
            echo '## Entry C scanner'
            echo "- Scan step: ${SCAN_OUTCOME:-not started} (exit ${SCAN_EXIT:-n/a})"
            echo "- Dry run: $DRY_RUN"
            echo "- Candidate window: $C_SIGNAL_START–15:30 IST; settled-candle re-check until $C_POST_CLOSE_UNTIL IST."
            echo "- Quote age limit: ${MAX_QUOTE_AGE_SECONDS}s. A delayed Yahoo quote is logged and used with its timestamp in the alert; it is not a failure."
            echo "- A successful scan does not imply a qualifying candidate."
            echo
            echo '### Per-symbol reasons'
            echo '```'
            grep -E 'INFO|WARNING|ERROR|Traceback|RuntimeError' entry_c_scan.log 2>/dev/null | tail -40 || echo 'no scanner output captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the machine-readable reasons on the run page (and to the
          # annotations API) so a "no alert" day can be understood without
          # downloading the raw log. Capped to keep the run page readable.
          grep -E 'Scan complete|WARNING|Traceback|RuntimeError' entry_c_scan.log 2>/dev/null \
            | tail -25 | sed 's/^/::notice title=entry-c scanner::/' || true
