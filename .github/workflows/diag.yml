name: diag-entry-c

# TEMPORARY diagnostic workflow. It never sends alerts and never writes the
# live ledger. It collects the logs of past runs (which are only reachable from
# a runner) and probes the live Yahoo feed, then publishes the result back to
# the branch so it can be inspected from anywhere.
on:
  push:
    branches: [arena/95a246a2-precision-test]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: entry-c-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same expressions as the live scan workflow.
      DRY_RUN: "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}"
      C_SIGNAL_START: ${{ vars.C_SIGNAL_START || '15:15' }}
      MAX_QUOTE_AGE_SECONDS: ${{ vars.MAX_QUOTE_AGE_SECONDS || '300' }}
      ACCOUNT_CAPITAL_INR: ${{ vars.ACCOUNT_CAPITAL_INR }}
      RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '1.0' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect logs of past scan runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir -p .diag
          # 38379429540 / 38379323940 failed inside the C window (15:21-15:22 IST)
          # 38380346320 succeeded just after the close; 38370997011 is the first run.
          for r in 38379429540 38379323940 38380346320 38370997011 38416056475; do
            {
              echo "### gh run view $r"
              gh run view "$r" --log 2>&1 || echo "(could not fetch logs for $r)"
            } > ".diag/run_$r.log"
          done
          wc -l .diag/run_*.log

      - name: Probe live feed and replay the scan decisions
        run: |
          set -x
          python tools/diag_probe.py --as-of "$C_SIGNAL_START" --quote-lag 900 \
            2>&1 | tee .diag/probe.txt || echo "probe exited non-zero" | tee -a .diag/probe.txt

      - name: Publish diagnostics back to the branch
        run: |
          set -euo pipefail
          git config user.name 'diag-bot'
          git config user.email 'diag-bot@users.noreply.github.com'
          git add -f .diag
          git commit -m "diag: capture scanner logs and live probe"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Echo the key lines as annotations (fallback read channel)
        if: always()
        run: |
          grep -hiE "RuntimeError|No fresh|no active 26|first OB already|is_potential_origin|BREAKOUT|breakout:|candidate skipped|Traceback" .diag/*.log .diag/*.txt 2>/dev/null \
            | tail -200 | sed 's/^/::warning title=diag::/' || true
